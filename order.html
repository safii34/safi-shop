<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ثبت سفارش UC پابجی موبایل | Safi Shop</title>
  <meta name="description" content="ثبت سفارش UC پابجی موبایل در Safi Shop با پرداخت از طریق HesabPay یا ATOMA و ارسال رسید پرداخت.">
  <meta name="robots" content="index,follow">
  <meta property="og:title" content="ثبت سفارش UC پابجی موبایل | Safi Shop">
  <meta property="og:description" content="ثبت سفارش UC پابجی موبایل با تحویل سریع.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://safii34.github.io/safi-shop/order.html">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#0d1628;color:#fff}
    .wrap{max-width:720px;margin:auto;padding:24px 16px 50px}
    .brand{background:linear-gradient(135deg,#ffb300,#ff5b20);padding:24px 18px;text-align:center;border-radius:0 0 22px 22px}
    h1{margin:0 0 8px;font-size:27px}.sub{opacity:.9}
    .card{background:#18253b;border:1px solid #263653;border-radius:18px;padding:22px;margin-top:20px;box-shadow:0 10px 30px #0004}
    label{display:block;margin:15px 0 7px;font-weight:bold}
    input,select{width:100%;padding:14px;border:1px solid #405170;border-radius:10px;background:#0e1829;color:#fff;font-size:16px}
    input:focus,select:focus{outline:2px solid #ffb300;border-color:#ffb300}
    .price{background:#101c30;padding:14px;border-radius:10px;font-size:20px;font-weight:bold;color:#ffbd19}
    .payment{background:#101c30;padding:15px;border-radius:10px;line-height:2}
    button{width:100%;border:0;border-radius:11px;padding:15px;margin-top:20px;background:#20c86b;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    .hint{font-size:13px;color:#aebbd0;margin-top:7px}.msg{margin-top:15px;padding:13px;border-radius:10px;display:none}
    .ok{display:block;background:#123d29;color:#8dffc0}.err{display:block;background:#4a2020;color:#ffb0b0}
    .req{color:#ffcf4a}.footer{text-align:center;color:#9eabc0;font-size:13px;margin-top:22px}
    .footer{color: #ce2626; font-size: 14px;}
    #edris{
      text-decoration: none;
      text-align: center;
      font-size: large;
    }

  </style>
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"Product",
    "name":"PUBG Mobile UC",
    "brand":{"@type":"Brand","name":"Safi Shop"},
    "offers":{"@type":"Offer","priceCurrency":"AFN","price":"720","availability":"https://schema.org/InStock"}
  }
  </script>
</head>
<body>
  <header class="brand">
    <h1>ثبت سفارش UC پابجی موبایل 🎮</h1>
    <div class="sub">Safi Shop | پرداخت امن و ارسال رسید</div><br>
    <p style="color: rgb(33, 33, 224); font-size: 20px; font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; text-shadow: #0e1829; margin: 0.5ch;font-weight: bold;">واریز یوسی ۱۰ دقیقه </p>
  </header>

  <main class="wrap">
    <section class="card">
      <form id="orderForm">
        <label>نوع UC</label>
        <select name="game" required>
          <option value="PUBG Mobile">PUBG Mobile</option>
        </select>

        <label>مقدار</label>
        <select id="amount" name="amount" required>
          <option value="60" data-price="70">60 UC</option>
          <option value="325" data-price="350">325 UC</option>
          <option value="660" data-price="680" selected>660 UC</option>
          <option value="1800" data-price="1700">1800 UC</option>
          <option value="3850" data-price="3300">3850 UC</option>
          <option value="8100" data-price="6400">8100 UC</option>
        </select>

        <label>قیمت</label>
        <div class="price" id="price">720 AFN</div>

        <label>Player ID <span class="req">*</span></label>
        <input name="playerId" inputmode="numeric" pattern="[0-9]{5,20}" maxlength="20" placeholder="مثلاً 5123456789" required>
        <div class="hint">Player ID پابجی را با دقت وارد کنید.</div>

        <label>روش پرداخت</label>
        <select id="payment" name="payment" required>
          <option value="HesabPay">HesabPay</option>
          <option value="ATOMA">ATOMA</option>
        </select>

        <label>اطلاعات پرداخت</label>
        <div class="payment" id="paymentInfo">HesabPay: <b>0796345081</b></div>

        <label>رسید پرداخت <span class="req">*</span></label>
        <input id="receipt" type="file" accept="image/*" required>
        <div class="hint">حداکثر 5MB — فقط عکس رسید پرداخت.</div>

        <button id="submitBtn" type="submit">ثبت Order</button>
        <div id="msg" class="msg"></div>
      </form>
    </section>
    <p id="edris"  > <a  href="index.html">برگشت صفحه اصلي</a></p>
    <div class="footer">پس از ثبت سفارش، اطلاعات برای بررسی و تکمیل سفارش ارسال می‌شود.</div>
  </main>

<script>
"use strict";

// آدرس Web App گوگل اسکریپت
const GAS_URL =
  "https://script.google.com/macros/s/AKfycbzdyhFd451fGtIpUomSWsX9SHyOq56JJOVBDTGgFlBJb5H7yiFcZbTPjSOKvYjA7bkMuA/exec";

// قیمت بسته‌ها به AFN
const prices = {
  "60": 70,
  "325": 350,
  "660": 680,
  "1800": 1700,
  "3850": 3300,
  "8100": 6400
};

// شماره‌های پرداخت
const accounts = {
  HesabPay: "0796345081",
  ATOMA: "0793801363"
};

const form = document.getElementById("orderForm");
const amount = document.getElementById("amount");
const price = document.getElementById("price");
const payment = document.getElementById("payment");
const paymentInfo = document.getElementById("paymentInfo");
const receiptInput = document.getElementById("receipt");
const msg = document.getElementById("msg");
const btn = document.getElementById("submitBtn");

// به‌روزرسانی قیمت و اطلاعات پرداخت
function updateUI() {
  const selectedAmount = amount.value;
  const selectedPayment = payment.value;

  price.textContent =
    (prices[selectedAmount] ?? 0) + " AFN";

  paymentInfo.textContent = "";

  const accountLabel = document.createTextNode(
    selectedPayment + ": "
  );

  const accountNumber = document.createElement("b");
  accountNumber.textContent =
    accounts[selectedPayment] || "";

  paymentInfo.appendChild(accountLabel);
  paymentInfo.appendChild(accountNumber);
}

amount.addEventListener("change", updateUI);
payment.addEventListener("change", updateUI);

updateUI();

// نمایش پیام
function showMessage(text, success) {
  msg.textContent = text;
  msg.className = "msg " + (success ? "ok" : "err");
  msg.style.display = "block";
}

// تبدیل عکس به Base64
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => {
      const result = String(reader.result || "");
      const commaIndex = result.indexOf(",");

      if (commaIndex === -1) {
        reject(new Error("خواندن عکس ناموفق بود."));
        return;
      }

      resolve(result.slice(commaIndex + 1));
    };

    reader.onerror = () => {
      reject(new Error("فایل رسید خوانده نشد."));
    };

    reader.readAsDataURL(file);
  });
}

// بررسی اولیه فرم
function validateOrder(file) {
  if (!GAS_URL || !GAS_URL.endsWith("/exec")) {
    throw new Error("آدرس Google Apps Script صحیح نیست.");
  }

  if (!form.playerId.value.trim().match(/^\d{5,20}$/)) {
    throw new Error("Player ID باید ۵ تا ۲۰ رقم باشد.");
  }

  if (!Object.prototype.hasOwnProperty.call(prices, amount.value)) {
    throw new Error("بسته UC انتخاب‌شده معتبر نیست.");
  }

  if (!Object.prototype.hasOwnProperty.call(accounts, payment.value)) {
    throw new Error("روش پرداخت معتبر نیست.");
  }

  if (!file) {
    throw new Error("لطفاً عکس رسید پرداخت را انتخاب کنید.");
  }

  const allowedTypes = [
    "image/jpeg",
    "image/png",
    "image/webp"
  ];

  if (!allowedTypes.includes(file.type)) {
    throw new Error("فرمت رسید باید JPG، PNG یا WEBP باشد.");
  }

  if (file.size === 0 || file.size > 5 * 1024 * 1024) {
    throw new Error("حجم عکس باید بیشتر از صفر و حداکثر 5MB باشد.");
  }
}

// ارسال سفارش
form.addEventListener("submit", async function (event) {
  event.preventDefault();

  if (btn.disabled) return;

  btn.disabled = true;
  btn.textContent = "در حال ارسال...";
  msg.style.display = "none";

  try {
    const file = receiptInput.files[0];

    validateOrder(file);

    const selectedAmount = amount.value;
    const selectedPayment = payment.value;

    // نام فیلدها با Google Apps Script هماهنگ است
    const data = {
      game: form.elements["game"].value,
      amount: selectedAmount,
      price: prices[selectedAmount],
      playerId: form.elements["playerId"].value.trim(),
      payment: selectedPayment,
      paymentAccount: accounts[selectedPayment],
      receiptName: file.name,
      receiptType: file.type,
      receiptBase64: await fileToBase64(file)
    };

    // ارسال به Google Apps Script
    const response = await fetch(GAS_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(data)
    });

    if (!response.ok) {
      throw new Error("خطای HTTP: " + response.status);
    }

    let result;

    try {
      result = await response.json();
    } catch (error) {
      throw new Error(
        "پاسخ سرور قابل خواندن نیست. تنظیمات Google Apps Script را بررسی کنید."
      );
    }

    if (!result || result.ok !== true) {
      throw new Error(
        result && result.message
          ? result.message
          : "سرور سفارش را تأیید نکرد."
      );
    }

    showMessage(
      "سفارش و رسید با موفقیت ارسال شد. منتظر بررسی باشید.",
      true
    );

    form.reset();

    amount.value = "660";
    payment.value = "HesabPay";

    updateUI();

  } catch (error) {
    console.error("Safi Shop order error:", error);

    showMessage(
      error.message ||
        "ارسال سفارش ناموفق بود. اتصال اینترنت و تنظیمات سرور را بررسی کنید.",
      false
    );

  } finally {
    btn.disabled = false;
    btn.textContent = "ثبت Order";
  }
});
      </script>
  
</body>
</html>
